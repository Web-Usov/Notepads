name: Windows preview installer

on:
  pull_request:
  push:
    branches: ['release/v*', 'native-preview/v*']
  workflow_dispatch:
  schedule:
    # Nightly installed-app UI checks on the default branch.
    - cron: '0 3 * * *'

permissions:
  contents: read

# Only keep the newest build for a PR; never cancel release publishing jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer:
    runs-on: windows-2022
    environment: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v') && 'notepads-release' || 'notepads-preview' }}
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v3

      - name: Test language extensions for release
        if: github.event_name == 'push'
        run: dotnet run --project tests/SyntaxExtensions/SyntaxExtensions.Tests.csproj --configuration Release

      - name: Build the x64 sideload bundle
        shell: pwsh
        run: |
          $publisher = 'CN=Web-Usov Notepads Preview'
          $path = Join-Path "$PWD/src/Notepads" 'Package.appxmanifest'
          [xml]$xml = Get-Content -LiteralPath $path -Raw
          $xml.Package.Identity.SetAttribute('Publisher', $publisher)
          $xml.Save($path)

          msbuild src/Notepads.sln /restore /m /p:Configuration=Release /p:Platform=x64 `
            /p:AppxPackageDir="$env:RUNNER_TEMP\Sideload\" /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Always /p:AppxBundlePlatforms=x64 /p:AppxPackageSigningEnabled=false
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Import the release signing certificate
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v')
        shell: pwsh
        env:
          NOTEPADS_RELEASE_PFX_BASE64: ${{ secrets.NOTEPADS_RELEASE_PFX_BASE64 }}
          NOTEPADS_RELEASE_PFX_PASSWORD: ${{ secrets.NOTEPADS_RELEASE_PFX_PASSWORD }}
        run: |
          $cert = & ./tools/installer/Import-ReleaseSigningCertificate.ps1 -Publisher 'CN=Web-Usov Notepads Preview'
          "RELEASE_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Sign and verify the installer
        id: package
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem "$env:RUNNER_TEMP/Sideload" -Recurse -Filter '*.msixbundle')
          if ($bundles.Count -ne 1) { throw "Expected one MSIX bundle, found $($bundles.Count)." }
          $bundle = $bundles[0]
          $dir = $bundle.DirectoryName
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22621.0\x64"
          $publisher = 'CN=Web-Usov Notepads Preview'

          [xml]$source = Get-Content "$PWD/src/Notepads/Package.appxmanifest" -Raw
          $version = $source.Package.Identity.Version
          $release = $env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME.StartsWith('release/')
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -cnotin @("release/v$version", "native-preview/v$version")) {
            throw "Publication branch must match the package version $version."
          }

          # Use the public name for the offline SDK bundle and the certificate exported alongside it.
          $bundleName = "Plainix_${version}_x64.msixbundle"
          if ($bundle.Name -cne $bundleName) {
            $bundle = Rename-Item -LiteralPath $bundle.FullName -NewName $bundleName -PassThru
          }

          if ($release) {
            $cert = Get-Item "Cert:\CurrentUser\My\$env:RELEASE_CERT_THUMBPRINT"
          } else {
            $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
              -KeyExportPolicy NonExportable -CertStoreLocation Cert:\CurrentUser\My `
              -NotAfter (Get-Date).AddDays(60) -HashAlgorithm SHA256 `
              -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          }
          try {
            $timestamp = if ($env:GITHUB_EVENT_NAME -eq 'push') { @('/tr', 'http://timestamp.digicert.com', '/td', 'SHA256') } else { @() }
            & "$sdk\signtool.exe" sign /fd SHA256 /sha1 $cert.Thumbprint @timestamp $bundle.FullName
            if ($LASTEXITCODE) { throw 'SignTool could not sign the bundle.' }
            Export-Certificate -Cert $cert -FilePath "$dir/$($bundle.BaseName).cer" | Out-Null
            $signature = Get-AuthenticodeSignature -LiteralPath $bundle.FullName
            if ($env:GITHUB_EVENT_NAME -eq 'push' -and !$signature.TimeStamperCertificate) { throw 'Release signature has no timestamp.' }
            if ($signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint -or $signature.Status -eq 'HashMismatch') {
              throw "Unexpected bundle signature: $($signature.Status)"
            }
          } finally {
            Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -DeleteKey
          }

          $unbundled = "$env:RUNNER_TEMP/Unbundled"
          & "$sdk\MakeAppx.exe" unbundle /p $bundle.FullName /d $unbundled /o
          if ($LASTEXITCODE) { throw 'Could not unpack the signed bundle.' }
          $zip = [IO.Compression.ZipFile]::OpenRead($bundle.FullName)
          try {
            $reader = [IO.StreamReader]::new($zip.GetEntry('AppxMetadata/AppxBundleManifest.xml').Open())
            try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally { $zip.Dispose() }
          $app = @($manifest.Bundle.Packages.Package | Where-Object { $_.Type -eq 'application' -and $_.Architecture -eq 'x64' })
          if ($app.Count -ne 1) { throw 'Expected one x64 application package.' }
          $layout = "$env:RUNNER_TEMP/VerifyApp"
          & "$sdk\MakeAppx.exe" unpack /p "$unbundled/$($app[0].FileName)" /d $layout /o
          if ($LASTEXITCODE) { throw 'Could not unpack the x64 application.' }

          [xml]$inner = Get-Content "$layout/AppxManifest.xml" -Raw
          if ($inner.Package.Identity.Name -ne 'Notepads-Dev' -or $inner.Package.Identity.Publisher -ne $publisher) {
            throw 'Unexpected preview package identity.'
          }
          $appManifest = $inner.Package.Applications.Application
          $visual = $appManifest.VisualElements
          if ($inner.Package.Properties.DisplayName -cne 'Plainix' -or $visual.DisplayName -cne 'Plainix' -or
              $visual.DefaultTile.ShortName -cne 'Plainix') { throw 'Installer, Start and tile names must be Plainix.' }
          $aliases = @($appManifest.SelectNodes(".//*[local-name()='ExecutionAlias']") | ForEach-Object { $_.GetAttribute('Alias') })
          $schemes = @($appManifest.SelectNodes(".//*[local-name()='Protocol']") | ForEach-Object { $_.GetAttribute('Name') })
          if ('plainix.exe' -notin $aliases -or 'Notepads-Dev.exe' -notin $aliases -or
              'plainix' -notin $schemes -or 'notepads' -notin $schemes) { throw 'A current or legacy activation entry is missing.' }
          if ($inner.Package.Identity.Version -ne $version) { throw 'Packaged version differs from the source manifest.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          if (!(Test-Path "$layout/Notepads.exe")) { throw 'The application executable is missing.' }
          $manifests = @(Get-ChildItem "$PWD/plugins/*/*.notepads-extension.json" -File)
          $packaged = @(Get-ChildItem "$layout/Assets/Extensions" -File -Recurse)
          if (!$manifests.Count -or $packaged.Count -ne $manifests.Count) {
            throw 'The package must contain exactly the bundled plugin manifests.'
          }
          foreach ($pluginManifest in $manifests) {
            $target = Join-Path "$layout/Assets/Extensions" $pluginManifest.Name
            if ((Get-FileHash -LiteralPath $target).Hash -ne (Get-FileHash -LiteralPath $pluginManifest.FullName).Hash) {
              throw "Packaged manifest differs from its source: $($pluginManifest.Name)"
            }
          }
          if (!(Test-Path "$dir/Install.ps1") -or !(Test-Path "$dir/Add-AppDevPackage.ps1")) {
            throw 'SDK sideload installer scripts are missing.'
          }
          foreach ($dependency in 'Microsoft.NET.Native.Runtime.2.2', 'Microsoft.NET.Native.Framework.2.2',
                                   'Microsoft.Services.Store.Engagement.x64.10.0', 'Microsoft.VCLibs.x64.14.00') {
            if (!(Test-Path "$dir/Dependencies/x64/$dependency.appx")) { throw "Missing $dependency" }
          }
          if (Get-ChildItem $dir -Recurse -Include *.pfx,*.p12) { throw 'Unexpected private key file.' }
          Get-ChildItem $dir -Recurse -Filter '*.appxsym' | Remove-Item
          "folder=$dir" >> $env:GITHUB_OUTPUT
          "Installer SHA-256: $((Get-FileHash $bundle.FullName).Hash)" >> $env:GITHUB_STEP_SUMMARY
          "Certificate SHA-256: $((Get-FileHash "$dir/$($bundle.BaseName).cer").Hash)" >> $env:GITHUB_STEP_SUMMARY

      - name: Generate native App Installer feed
        shell: pwsh
        run: |
          $version = '${{ steps.package.outputs.version }}'
          $stable = $env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME.StartsWith('release/')
          $tag = if ($stable) { "v$version" } else { "v$version-preview" }
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/"
          $feed = if ($stable) { "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/Plainix.appinstaller" } else { "${base}Plainix.appinstaller" }
          ./tools/installer/New-AppInstaller.ps1 -PackageFolder '${{ steps.package.outputs.folder }}' `
            -OutputDirectory "$env:RUNNER_TEMP/NativeInstaller" -FeedUri $feed -AssetBaseUri $base

      - uses: actions/upload-artifact@v4
        with:
          name: native-installer
          path: ${{ runner.temp }}/NativeInstaller/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: Plainix-Windows-x64
          path: ${{ steps.package.outputs.folder }}/
          if-no-files-found: error
          retention-days: 30

  editor-smoke:
    name: Exercise the installed editor
    needs: installer
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Plainix-Windows-x64
          path: ${{ runner.temp }}/notepads-smoke-package
      - name: Verify editing, Undo and source navigation
        shell: powershell
        run: powershell.exe -NoProfile -STA -File tests/SyntaxExtensions/WindowsEditorSmoke.ps1 -PackageFolder "$env:RUNNER_TEMP\notepads-smoke-package"

  ui-tests:
    name: Windows UI E2E (NUnit / FlaUI)
    needs: installer
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: Plainix-Windows-x64
          path: ${{ runner.temp }}/plainix-ui-package
      - name: Exercise editor, find, preferences, extensions and visual landmarks
        shell: powershell
        run: powershell.exe -NoProfile -STA -File tests/UI/Run-UiTests.ps1 -PackageFolder "$env:RUNNER_TEMP\\plainix-ui-package" -ResultsDirectory "$env:RUNNER_TEMP\\plainix-ui-results"
      - name: Upload TRX and UI failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: ${{ runner.temp }}/plainix-ui-results/
          if-no-files-found: warn
          retention-days: 14

  native-install:
    name: Install with Windows App Installer
    needs: installer
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-installer
          path: ${{ runner.temp }}/native-installer
      - name: Upgrade an existing Notepads installation using the descriptor
        shell: powershell
        run: ./tests/Installer/NativeInstallerSmoke.ps1 -FeedFolder "$env:RUNNER_TEMP/native-installer" -TestUpgradeFromFirstRelease

  release-guards-tests:
    name: Test release publication guards (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check release tag and version invariants without API writes
        run: bash tests/Installer/PublishGuardsTests.sh

  publish:
    name: Publish Windows x64 installer
    if: github.event_name == 'push'
    needs: [installer, native-install, editor-smoke, ui-tests, release-guards-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Stable tags all update the same /releases/latest feed. Queue jobs rather than dropping pending releases.
    concurrency:
      group: ${{ startsWith(github.ref, 'refs/heads/release/v') && 'plainix-stable-publication' || format('plainix-preview-publication-{0}', github.ref) }}
      cancel-in-progress: false
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.installer.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Plainix-Windows-x64
          path: installer
      - uses: actions/download-artifact@v4
        with:
          name: native-installer
          path: native-installer
      - name: Upload all assets and publish the release
        run: bash tools/installer/publish.sh

  public-install:
    name: Install from the published GitHub download
    needs: [installer, publish]
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-installer
          path: ${{ runner.temp }}/native-installer
      - name: Verify public files and deploy the downloaded App Installer descriptor
        shell: powershell
        run: |
          [xml]$descriptor = Get-Content "$env:RUNNER_TEMP/native-installer/Plainix.appinstaller" -Raw
          ./tests/Installer/NativeInstallerSmoke.ps1 -FeedFolder "$env:RUNNER_TEMP/native-installer" -PublishedFeedUri $descriptor.AppInstaller.Uri
