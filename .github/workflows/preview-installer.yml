name: Windows preview installer

on:
  pull_request:
  push:
    branches: ['release/v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v3

      - name: Test language extensions for release
        if: github.event_name == 'push'
        run: dotnet run --project tests/SyntaxExtensions/SyntaxExtensions.Tests.csproj --configuration Release

      - name: Build the x64 sideload bundle
        shell: pwsh
        run: |
          $publisher = 'CN=Web-Usov Notepads Preview'
          foreach ($file in 'Package.appxmanifest', 'Package.StoreAssociation.xml') {
            $path = Join-Path "$PWD/src/Notepads" $file
            [xml]$xml = Get-Content -LiteralPath $path -Raw
            if ($file -eq 'Package.appxmanifest') {
              $xml.Package.Identity.SetAttribute('Publisher', $publisher)
              $xml.Package.Properties.PublisherDisplayName = 'Web-Usov'
            } else {
              $xml.StoreAssociation.Publisher = $publisher
              $xml.StoreAssociation.PublisherDisplayName = 'Web-Usov'
            }
            $xml.Save($path)
          }

          msbuild src/Notepads.sln /restore /m /p:Configuration=Release /p:Platform=x64 `
            /p:AppxPackageDir="$env:RUNNER_TEMP\Sideload\" /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Always /p:AppxBundlePlatforms=x64 /p:AppxPackageSigningEnabled=false
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Sign and verify the installer
        id: package
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem "$env:RUNNER_TEMP/Sideload" -Recurse -Filter '*.msixbundle')
          if ($bundles.Count -ne 1) { throw "Expected one MSIX bundle, found $($bundles.Count)." }
          $bundle = $bundles[0]
          $dir = $bundle.DirectoryName
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22621.0\x64"
          $publisher = 'CN=Web-Usov Notepads Preview'

          [xml]$source = Get-Content "$PWD/src/Notepads/Package.appxmanifest" -Raw
          $version = $source.Package.Identity.Version
          $release = $env:GITHUB_EVENT_NAME -eq 'push'
          if ($release -and $env:GITHUB_REF_NAME -cne "release/v$version") {
            throw "Release branch must match the package version $version."
          }
          $expires = if ($release) { (Get-Date).AddYears(5) } else { (Get-Date).AddDays(60) }

          # The private key stays on this runner. Distribute only the public certificate.
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -KeyExportPolicy NonExportable -CertStoreLocation Cert:\CurrentUser\My `
            -NotAfter $expires -HashAlgorithm SHA256 `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          try {
            $timestamp = if ($release) { @('/tr', 'http://timestamp.digicert.com', '/td', 'SHA256') } else { @() }
            & "$sdk\signtool.exe" sign /fd SHA256 /sha1 $cert.Thumbprint @timestamp $bundle.FullName
            if ($LASTEXITCODE) { throw 'SignTool could not sign the bundle.' }
            Export-Certificate -Cert $cert -FilePath "$dir/$($bundle.BaseName).cer" | Out-Null
            $signature = Get-AuthenticodeSignature -LiteralPath $bundle.FullName
            if ($release -and !$signature.TimeStamperCertificate) { throw 'Release signature has no timestamp.' }
            if ($signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint -or $signature.Status -eq 'HashMismatch') {
              throw "Unexpected bundle signature: $($signature.Status)"
            }
          } finally {
            Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -DeleteKey
          }

          $unbundled = "$env:RUNNER_TEMP/Unbundled"
          & "$sdk\MakeAppx.exe" unbundle /p $bundle.FullName /d $unbundled /o
          if ($LASTEXITCODE) { throw 'Could not unpack the signed bundle.' }
          $zip = [IO.Compression.ZipFile]::OpenRead($bundle.FullName)
          try {
            $reader = [IO.StreamReader]::new($zip.GetEntry('AppxMetadata/AppxBundleManifest.xml').Open())
            try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally { $zip.Dispose() }
          $app = @($manifest.Bundle.Packages.Package | Where-Object { $_.Type -eq 'application' -and $_.Architecture -eq 'x64' })
          if ($app.Count -ne 1) { throw 'Expected one x64 application package.' }
          $layout = "$env:RUNNER_TEMP/VerifyApp"
          & "$sdk\MakeAppx.exe" unpack /p "$unbundled/$($app[0].FileName)" /d $layout /o
          if ($LASTEXITCODE) { throw 'Could not unpack the x64 application.' }

          [xml]$inner = Get-Content "$layout/AppxManifest.xml" -Raw
          if ($inner.Package.Identity.Name -ne 'Notepads-Dev' -or $inner.Package.Identity.Publisher -ne $publisher) {
            throw 'Unexpected preview package identity.'
          }
          if ($inner.Package.Identity.Version -ne $version) { throw 'Packaged version differs from the source manifest.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          if (!(Test-Path "$layout/Notepads.exe")) { throw 'The application executable is missing.' }
          $manifests = @(Get-ChildItem "$PWD/plugins/*/*.notepads-extension.json" -File)
          $packaged = @(Get-ChildItem "$layout/Assets/Extensions" -File -Recurse)
          if (!$manifests.Count -or $packaged.Count -ne $manifests.Count) {
            throw 'The package must contain exactly the bundled plugin manifests.'
          }
          foreach ($pluginManifest in $manifests) {
            $target = Join-Path "$layout/Assets/Extensions" $pluginManifest.Name
            if ((Get-FileHash -LiteralPath $target).Hash -ne (Get-FileHash -LiteralPath $pluginManifest.FullName).Hash) {
              throw "Packaged manifest differs from its source: $($pluginManifest.Name)"
            }
          }
          if (!(Test-Path "$dir/Install.ps1") -or !(Test-Path "$dir/Add-AppDevPackage.ps1")) {
            throw 'SDK sideload installer scripts are missing.'
          }
          foreach ($dependency in 'Microsoft.NET.Native.Runtime.2.2', 'Microsoft.NET.Native.Framework.2.2',
                                   'Microsoft.Services.Store.Engagement.x64.10.0', 'Microsoft.VCLibs.x64.14.00') {
            if (!(Test-Path "$dir/Dependencies/x64/$dependency.appx")) { throw "Missing $dependency" }
          }
          if (Get-ChildItem $dir -Recurse -Include *.pfx,*.p12) { throw 'Unexpected private key file.' }
          Get-ChildItem $dir -Recurse -Filter '*.appxsym' | Remove-Item
          "folder=$dir" >> $env:GITHUB_OUTPUT
          "Installer SHA-256: $((Get-FileHash $bundle.FullName).Hash)" >> $env:GITHUB_STEP_SUMMARY
          "Certificate SHA-256: $((Get-FileHash "$dir/$($bundle.BaseName).cer").Hash)" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: Notepads-Dev-Windows-x64
          path: ${{ steps.package.outputs.folder }}/
          if-no-files-found: error
          retention-days: 30

  editor-smoke:
    name: Exercise the installed editor
    if: github.event_name == 'pull_request'
    needs: installer
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Notepads-Dev-Windows-x64
          path: ${{ runner.temp }}/notepads-smoke-package
      - name: Verify editing, Undo and source navigation
        shell: powershell
        run: powershell.exe -NoProfile -STA -File tests/SyntaxExtensions/WindowsEditorSmoke.ps1 -PackageFolder "$env:RUNNER_TEMP\notepads-smoke-package"

  publish:
    name: Publish Windows x64 release
    if: github.event_name == 'push'
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: publish-${{ github.ref }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.installer.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Notepads-Dev-Windows-x64
          path: installer

      - name: Package installer and publish
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          asset="Notepads-$VERSION-Windows-x64.zip"
          (cd installer && zip -qr "../$asset" .)
          unzip -tq "$asset"
          sha256sum "$asset" > SHA256SUMS.txt
          cert=$(find installer -maxdepth 1 -type f -iname '*.cer' -print -quit)
          cert_sha=$(sha256sum "$cert" | cut -d ' ' -f 1)
          cat > notes.md <<'NOTES'
          ## What’s new

          - Format or minify a JSON selection or document under **Extension commands**. Invalid JSON points to the error and leaves the text intact.
          - Use **Open Log Lens** to filter log lines by request ID and severity. Select a result to reveal the original line.
          - Install extensions from a local JSON or ZIP, an HTTPS download, or a public GitHub repository or release. API v2 adds commands and read-only results panels alongside existing v1 grammars.

          ## Install on Windows x64

          Download the Windows x64 ZIP under **Assets** and extract it. Open PowerShell in the extracted folder and run the following command. Leave the window open and follow the Windows certificate prompt.

          ```powershell
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Add-AppDevPackage.ps1
          ```

          Launch **Notepads-Dev** and open a `.json` file. The package uses the same app identity as the fork preview, so you can install it over that version. The ZIP includes the MSIX bundle, its dependencies and the public signing certificate. The fork uses a self-signed certificate. Windows may ask for administrator approval to trust it.
          NOTES
          echo >> notes.md
          echo "SHA-256 of the included public certificate: \`$cert_sha\`." >> notes.md
          echo >> notes.md
          echo "[Extension authoring guide](https://github.com/$GITHUB_REPOSITORY/blob/$tag/docs/extensions.md) · [Agent skill](https://github.com/$GITHUB_REPOSITORY/blob/$tag/.agents/skills/create-notepads-extension/SKILL.md)" >> notes.md

          # Keep the public release hidden until both assets have uploaded.
          release_url="repos/$GITHUB_REPOSITORY/releases"
          existing=$(gh api --paginate "$release_url" --jq ".[] | select(.tag_name == \"$tag\") | [.draft,.target_commitish] | @tsv")
          if [[ -n "$existing" ]]; then
            read -r draft target <<< "$existing"
            [[ "$draft" == "true" && "$target" == "$GITHUB_SHA" ]] || { echo "Release already exists for $tag."; exit 1; }
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Notepads $tag" --notes-file notes.md
          fi
          gh release upload "$tag" "$asset" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
